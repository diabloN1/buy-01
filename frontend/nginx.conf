server {
    listen       8080;

    root   /usr/share/nginx/html;
    index  index.html;

    # gzip text-based responses.
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 6;

    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # Hashed assets re-build The filename changes when content changes.
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Angular Router can resolve client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
